name: release-tag-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish, for example v1.1.2'
        required: true
        type: string
      source_ref:
        description: 'Optional commit or branch to verify before creating the release tag'
        required: false
        type: string
      publish_release:
        description: 'Create or update the release draft (disable for preflight builds)'
        default: true
        type: boolean

permissions:
  contents: write

env:
  MIRA_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify-console:
    name: Verify web console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.MIRA_RELEASE_TAG }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install dependencies and build console
        run: bash ./tools/relay/build-console.sh

  build-python-android:
    name: Build Python package and Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.MIRA_RELEASE_TAG }}
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'

      - name: Create CI-only Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Validate release version
        run: |
          chmod +x ./mira-build
          ./mira-build --validate-only --release-tag "${MIRA_RELEASE_TAG}"

      - name: Build Python package and Android APK
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          chmod +x ./gradlew ./mira-build ./tools/android/build-frida-16.7-compat-apk.sh ./tools/android/prepare-frida-gadget.sh
          ./mira-build --target python --release-tag "${MIRA_RELEASE_TAG}"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          MIRA_FRIDA_COMPAT_OUTPUT_DIR="$PWD/dist/android" \
          MIRA_FRIDA_COMPAT_OUTPUT_APK="$PWD/dist/android/mira-app-debug.apk" \
            ./tools/android/build-frida-16.7-compat-apk.sh
          test -s dist/android/mira-app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose --print-certs dist/android/mira-app-debug.apk \
            > dist/android/ci-signing-certificate.txt
          sha256sum dist/android/mira-app-debug.apk > dist/android/SHA256SUMS

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mira-python-${{ env.MIRA_RELEASE_TAG }}
          path: |
            dist/python/**
            dist/release-manifest.json
          if-no-files-found: error

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mira-android-${{ env.MIRA_RELEASE_TAG }}
          path: |
            dist/android/**
            dist/release-manifest.json
          if-no-files-found: error

  build-ios-generic:
    name: Build iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.MIRA_RELEASE_TAG }}
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install iOS build prerequisites
        run: |
          brew install llvm lld ninja pkg-config libarchive
          python -m pip install --upgrade pip meson

      - name: Set up verified Zig 0.16.0 for the Frida musl build
        run: |
          case "$(uname -m)" in
            arm64|aarch64)
              zig_arch=aarch64
              zig_sha256=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
              ;;
            x86_64)
              zig_arch=x86_64
              zig_sha256=0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7
              ;;
            *) echo "Unsupported Zig host architecture" >&2; exit 1 ;;
          esac
          zig_directory="zig-$zig_arch-macos-0.16.0"
          zig_archive="$RUNNER_TEMP/$zig_directory.tar.xz"
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/0.16.0/$zig_directory.tar.xz" -o "$zig_archive"
          printf '%s  %s\n' "$zig_sha256" "$zig_archive" | shasum -a 256 -c -
          python - "$zig_archive" "$RUNNER_TEMP" "$zig_directory" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive, destination, expected_root = sys.argv[1:]
          target = Path(destination) / expected_root
          if target.exists() or target.is_symlink():
              raise SystemExit("Zig extraction destination already exists")
          with tarfile.open(archive) as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  protected = any(part == ".env" or (part.startswith(".env.") and part != ".env.example") for part in path.parts)
                  if (path.is_absolute() or ".." in path.parts or not path.parts
                          or path.parts[0] != expected_root or protected
                          or not (member.isfile() or member.isdir())):
                      raise SystemExit("Unsafe entry in Zig archive")
              bundle.extractall(Path(destination), members=members)
          PY
          zig_path="$(cd "$RUNNER_TEMP/$zig_directory" && pwd)/zig"
          test "$("$zig_path" version)" = 0.16.0
          printf 'ZIG=%s\n' "$zig_path" >> "$GITHUB_ENV"
          "$zig_path" cc --version

      - name: Validate release version
        run: |
          chmod +x ./mira-build
          ./mira-build --validate-only --release-tag "${MIRA_RELEASE_TAG}"

      - name: Prepare iOS native dependencies
        run: |
          MIRA_ISH_SDK=iphoneos \
          MIRA_ISH_BUILD_DIR="$PWD/build/ios-ish-device-libs" \
          bash ./tools/ios/build-ish-libs.sh
          bash ./tools/ios/build-frida-musl-devkit.sh
          MIRA_ISH_SKIP_COMPILEALL=1 \
          MIRA_ISH_ROOTFS_OUTPUT="$PWD/build/ios-mira-device-native-relay-derived/Build/Products/Debug-iphoneos/Mira.app/MiraISHRoot.fakefs" \
          bash ./tools/ios/prepare-ish-rootfs.sh

      - name: Build iOS unsigned IPA with generic iphoneos destination
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          chmod +x ./mira-build
          MIRA_ISH_SKIP_COMPILEALL=1 ./mira-build --target ios --ios-destination-mode generic --release-tag "${MIRA_RELEASE_TAG}"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mira-ios-${{ env.MIRA_RELEASE_TAG }}
          path: |
            dist/ios/**
            dist/release-manifest.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release assets
    if: github.event_name == 'push' || (inputs.publish_release && !inputs.source_ref)
    runs-on: ubuntu-latest
    needs:
      - verify-console
      - build-python-android
      - build-ios-generic
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v8
        with:
          name: mira-python-${{ env.MIRA_RELEASE_TAG }}
          path: release-assets/python

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: mira-android-${{ env.MIRA_RELEASE_TAG }}
          path: release-assets/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: mira-ios-${{ env.MIRA_RELEASE_TAG }}
          path: release-assets/ios

      - name: Publish assets to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.MIRA_RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          # The public Android APK is signed locally with the maintainer's
          # persistent debug identity and uploaded only after verification.
          # See docs/RELEASING.md. Never publish this draft without it.
          files: |
            release-assets/python/python/*
            release-assets/ios/ios/*
