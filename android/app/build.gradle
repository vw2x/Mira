plugins {
    id "com.android.application"
}

def generatedToolboxAssetsDir = file("${buildDir}/generated/mira-toolbox-assets")
def bootstrapPython = System.getenv("MIRA_PYTHON3") ?: "python3"
def fridaVersion = System.getenv("MIRA_FRIDA_VERSION") ?: "16.0.7"
// Opt in to three standalone APKs without changing mira-android's default APK path.
def buildAbiSplits = providers.gradleProperty("miraAbiSplits").map { it.toBoolean() }.getOrElse(false)
def bootstrapStateVersion = providers.gradleProperty("miraBootstrapStateVersion").map { it.toInteger() }.getOrElse(9)
def unsignedDebug = providers.gradleProperty("miraUnsignedDebug").map { it.toBoolean() }.getOrElse(false)

android {
    namespace "com.vwww.mira"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    aaptOptions {
        ignoreAssetsPattern ""
    }

    packaging {
        jniLibs {
            // Compress the directly distributed APK; Android extracts JNI libraries
            // and libdynamic.config.so together. AGP 9.3 also removes the global
            // .so no-compress rule, allowing bootstrap assets to use DEFLATE.
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "com.vwww.mira"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 122
        versionName "1.2.2"
        buildConfigField "int", "MIRA_BOOTSTRAP_STATE_VERSION", bootstrapStateVersion.toString()

        ndk {
            if (!buildAbiSplits) {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    splits {
        abi {
            enable buildAbiSplits
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            if (unsignedDebug) {
                signingConfig null
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("${rootDir}/native/CMakeLists.txt")
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [generatedToolboxAssetsDir]
        }
    }
}

dependencies {
    implementation project(":termux-am-library")
}

tasks.register("syncWebAssets", Copy) {
    from "$rootDir/web"
    into "$projectDir/src/main/assets/web"
}

tasks.register("buildTermuxPrefixAssets", Exec) {
    group = "build"
    description = "Build relocatable Termux bootstrap prefix assets"
    workingDir rootDir
    inputs.file("${rootDir}/tools/termux/build-bootstrap-prefix.py")
    inputs.file("${rootDir}/mira/mcp/frida_agent.py")
    inputs.dir("${rootDir}/third_party/frida-tools")
    inputs.property("miraFridaVersion", fridaVersion)
    outputs.dir("${generatedToolboxAssetsDir}/bootstrap/prefix/arm64-v8a")
    environment "MIRA_FRIDA_VERSION", fridaVersion
    commandLine bootstrapPython, "${rootDir}/tools/termux/build-bootstrap-prefix.py", generatedToolboxAssetsDir.absolutePath
}

preBuild.dependsOn("syncWebAssets")
preBuild.dependsOn("buildTermuxPrefixAssets")
